<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0a0a0a"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="48" fill="#111"/>
  <text x="32" y="30" font-family="monospace" font-size="13" fill="#888">Video Game Sales Analysis</text>
  <rect x="620" y="12" width="80" height="24" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="636" y="28" font-family="monospace" font-size="10" fill="#666">Export</text>
  <rect x="710" y="12" width="60" height="24" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <text x="726" y="28" font-family="monospace" font-size="10" fill="#666">Filter</text>

  <!-- Scatter Plot -->
  <rect x="32" y="68" width="460" height="260" rx="8" fill="#111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="52" y="92" font-family="monospace" font-size="11" fill="#888">Sales vs Playtime Correlation</text>
  <text x="52" y="106" font-family="monospace" font-size="9" fill="#555">R² = 0.73  |  p &lt; 0.001</text>
  <!-- Axis lines -->
  <line x1="72" y1="120" x2="72" y2="310" stroke="#222" stroke-width="1"/>
  <line x1="72" y1="310" x2="470" y2="310" stroke="#222" stroke-width="1"/>
  <text x="240" y="326" font-family="monospace" font-size="9" fill="#444">Avg Playtime (hrs)</text>
  <!-- Scatter dots -->
  <circle cx="120" cy="280" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="145" cy="265" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="160" cy="270" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="180" cy="250" r="6" fill="#3b82f6" opacity="0.6"/>
  <circle cx="200" cy="240" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="215" cy="255" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="230" cy="230" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="255" cy="220" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="270" cy="210" r="6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="290" cy="200" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="310" cy="195" r="5" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="330" cy="180" r="4" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="350" cy="175" r="7" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="370" cy="160" r="4" fill="#ec4899" opacity="0.6"/>
  <circle cx="390" cy="155" r="5" fill="#ec4899" opacity="0.6"/>
  <circle cx="410" cy="145" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="430" cy="135" r="6" fill="#ec4899" opacity="0.6"/>
  <circle cx="450" cy="130" r="4" fill="#ec4899" opacity="0.6"/>
  <!-- Trend line -->
  <line x1="100" y1="290" x2="460" y2="125" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Stats Cards -->
  <rect x="510" y="68" width="258" height="75" rx="8" fill="#111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="530" y="92" font-family="monospace" font-size="10" fill="#555">Total Games Analyzed</text>
  <text x="530" y="120" font-family="monospace" font-size="22" fill="#fff" font-weight="bold">16,598</text>

  <rect x="510" y="153" width="258" height="75" rx="8" fill="#111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="530" y="177" font-family="monospace" font-size="10" fill="#555">Avg Global Sales</text>
  <text x="530" y="205" font-family="monospace" font-size="22" fill="#fff" font-weight="bold">$7.2M</text>

  <rect x="510" y="238" width="258" height="90" rx="8" fill="#111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="530" y="262" font-family="monospace" font-size="10" fill="#555">Top Genre</text>
  <text x="530" y="286" font-family="monospace" font-size="16" fill="#fff">Action</text>
  <text x="530" y="306" font-family="monospace" font-size="10" fill="#22c55e">+12.4% YoY</text>

  <!-- Bar Chart -->
  <rect x="32" y="348" width="736" height="132" rx="8" fill="#111" stroke="#1a1a1a" stroke-width="1"/>
  <text x="52" y="372" font-family="monospace" font-size="11" fill="#888">Sales by Platform</text>
  <!-- Bars -->
  <rect x="80" y="390" width="60" height="70" rx="2" fill="#3b82f6" opacity="0.7"/>
  <text x="95" y="476" font-family="monospace" font-size="8" fill="#555">PS4</text>
  <rect x="160" y="400" width="60" height="60" rx="2" fill="#3b82f6" opacity="0.6"/>
  <text x="172" y="476" font-family="monospace" font-size="8" fill="#555">Xbox</text>
  <rect x="240" y="415" width="60" height="45" rx="2" fill="#8b5cf6" opacity="0.6"/>
  <text x="255" y="476" font-family="monospace" font-size="8" fill="#555">PC</text>
  <rect x="320" y="410" width="60" height="50" rx="2" fill="#8b5cf6" opacity="0.6"/>
  <text x="327" y="476" font-family="monospace" font-size="8" fill="#555">Switch</text>
  <rect x="400" y="430" width="60" height="30" rx="2" fill="#ec4899" opacity="0.5"/>
  <text x="415" y="476" font-family="monospace" font-size="8" fill="#555">3DS</text>
  <rect x="480" y="435" width="60" height="25" rx="2" fill="#ec4899" opacity="0.5"/>
  <text x="493" y="476" font-family="monospace" font-size="8" fill="#555">Wii</text>
  <rect x="560" y="440" width="60" height="20" rx="2" fill="#ec4899" opacity="0.4"/>
  <text x="570" y="476" font-family="monospace" font-size="8" fill="#555">Mobile</text>
  <rect x="640" y="445" width="60" height="15" rx="2" fill="#ec4899" opacity="0.4"/>
  <text x="653" y="476" font-family="monospace" font-size="8" fill="#555">VR</text>
</svg>
