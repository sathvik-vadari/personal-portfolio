  <text x="580" y="296" font-family="sans-serif" font-size="11" fill="#888">Legend</text>
  <circle cx="592" cy="316" r="5" fill="#ef4444"/>
  <text x="604" y="320" font-family="sans-serif" font-size="10" fill="#888">High Priority</text>
  <circle cx="592" cy="336" r="5" fill="#f59e0b"/>
  <text x="604" y="340" font-family="sans-serif" font-size="10" fill="#888">In Progress</text>
  <circle cx="592" cy="356" r="5" fill="#22c55e"/>
  <text x="604" y="360" font-family="sans-serif" font-size="10" fill="#888">Resolved</text>

  <!-- Recent Reports -->
  <text x="580" y="396" font-family="sans-serif" font-size="11" fill="#888">Recent Reports</text>
  <rect x="580" y="408" width="200" height="36" rx="4" fill="#1a1a1a"/>
  <text x="596" y="424" font-family="sans-serif" font-size="9" fill="#ef4444">Banjara Hills Rd 12</text>
  <text x="596" y="438" font-family="sans-serif" font-size="8" fill="#555">2 hrs ago · Construction waste</text>
  <rect x="580" y="452" width="200" height="36" rx="4" fill="#1a1a1a"/>
  <text x="596" y="468" font-family="sans-serif" font-size="9" fill="#f59e0b">HITEC City Junction</text>
  <text x="596" y="482" font-family="sans-serif" font-size="8" fill="#555">5 hrs ago · Mixed waste pile</text>
